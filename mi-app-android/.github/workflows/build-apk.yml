name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK and AAB
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK-Instalable
          path: app/build/outputs/apk/release/*.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAB-GooglePlay
          path: app/build/outputs/bundle/release/*.aab

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${ github.run_number }
          name: APK AppMint v1.0.${ github.run_number }
          body: |
            APK generado automaticamente con AppMint Studio.
            Descarga e instala el archivo .apk en tu telefono
            (permite instalar aplicaciones de origenes desconocidos).
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false
